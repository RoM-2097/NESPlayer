# Render blueprint — deploy NESPLAYER (static host + WebRTC signaling).
# Render sets PORT automatically and provides HTTPS. The Socket.io signaling
# server only brokers SDP/ICE to establish the peer-to-peer WebRTC connection;
# all gameplay flows directly between the two browsers.
services:
  - type: web
    name: nesplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: ALLOWED_ORIGINS
        sync: false
