# Render blueprint — deploy NESPLAYER (static host + WebSocket relay) to the
# Render free/starter tier in one click. Render sets PORT automatically and
# provides HTTPS, so netplay upgrades to wss:// on the same origin.
services:
  - type: web
    name: nesplayer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: ALLOWED_ORIGINS
        sync: false
