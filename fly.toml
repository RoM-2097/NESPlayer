# Fly.io configuration — deploy NESPLAYER (static host + WebRTC signaling).
# Fly provides HTTPS/TLS and wires the PORT env var automatically. The
# Socket.io server only brokers SDP/ICE; gameplay is peer-to-peer via WebRTC.
app = "nesplayer"
primary_region = "iad"

[build]
  builder = "heroku/buildpacks:nodejs"

[env]
  NODE_VERSION = "18"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[processes]
  app = "node server/signal.js"
